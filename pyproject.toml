[project]
name = "pasalkini"
version = "0.1.0"
description = "Date-aware legal information assistant for Indonesian labor law"
readme = "README.md"
authors = [
    { name = "Gilbert Owen", email = "psychoganko@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "google-genai>=2.33.0",
    "gradio>=6.29.0",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "ollama>=0.6.3",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "pysastrawi>=1.2.1",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "uvicorn>=0.30",
]

[project.scripts]
pasalkini = "pasalkini.cli:main"

[project.optional-dependencies]
tracing = [
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-sdk>=1.45.0",
]

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "hypothesis>=6.168.3",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-sdk>=1.45.0",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
