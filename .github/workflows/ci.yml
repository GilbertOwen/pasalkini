# Lint, tests and the retrieval gate. Nothing here needs Ollama, a GPU or the downloaded PDFs:
# the tests use a scripted model, and the gate runs on the snapshot in evals/fixtures/.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to a commit; the tag is in the comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.1" # the version the lockfile was written with
          enable-cache: true

      - name: Install the project
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Tests
        run: uv run pytest

      # Fails when Recall@5 drops, or when text that did not apply on a question's date gets
      # into its top 5. See src/pasalkini/evals/gate.py.
      - name: Retrieval gate
        run: uv run pasalkini gate
